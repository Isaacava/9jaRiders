name: Build deterministic 3D race art

on:
  push:
    paths:
      - "scripts/build_race_models.py"
      - ".github/workflows/build-race-assets.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check trimesh==4.11.1 numpy==2.3.5
      - run: python scripts/build_race_models.py
      - name: Commit generated GLB packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/models/*.glb
          if git diff --cached --quiet; then
            echo "No model changes"
            exit 0
          fi
          git commit -m "chore: refresh deterministic 3d race assets"
          git push