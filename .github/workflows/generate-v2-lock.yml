name: Generate exact v2 package lock

on:
  push:
    branches: [zip-sync-staging-20261003]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zip-sync-staging-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact lockfile
        run: |
          node - <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const data = fs.readFileSync('package-lock.json');
          const sha = crypto.createHash('sha1').update(data).digest('hex');
          if (sha !== '0ac9e7ff806a9a4b44cbeb552d2819ba25bccfaa') process.exit(1);
          console.log('Exact lockfile verified:', sha);
          JS
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Stage exact v2 package lock"
          git push origin HEAD:zip-sync-staging-20261003
